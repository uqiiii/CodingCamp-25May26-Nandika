<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <h1>💰 Expense & Budget Visualizer</h1>
      <div class="header-actions">
        <button id="btnTheme" class="btn-icon" title="Toggle dark/light mode">🌙</button>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- Total Balance -->
    <section class="balance-card" id="balanceSection">
      <p class="balance-label">TOTAL BALANCE</p>
      <h2 class="balance-amount" id="totalBalance">Rp 0</h2>
    </section>

    <!-- Input Form -->
    <section class="card form-section">
      <h2 class="section-title">Add Transaction</h2>
      <div class="form-group">
        <label for="itemName">Item Name</label>
        <input type="text" id="itemName" placeholder="e.g. Nasi Padang" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="amount">Amount (Rp)</label>
          <input type="number" id="amount" placeholder="e.g. 25000" min="0" />
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="">-- Select Category --</option>
            <option value="Food">🍔 Food</option>
            <option value="Transport">🚌 Transport</option>
            <option value="Fun">🎮 Fun</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Health">💊 Health</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="spendLimit">
          Monthly Spending Limit (Rp)
          <span class="badge-optional">Optional</span>
        </label>
        <input type="number" id="spendLimit" placeholder="e.g. 500000" min="0" />
      </div>

      <div class="error-msg" id="errorMsg"></div>
      <button class="btn-primary" id="btnAdd">Add Transaction</button>
    </section>

    <!-- Main Content: Transactions + Chart -->
    <div class="content-grid">

      <!-- Transaction List -->
      <section class="card transactions-section">
        <div class="transactions-header">
          <h2 class="section-title">Transactions</h2>
          <div class="sort-controls">
            <label for="sortBy">Sort:</label>
            <select id="sortBy">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="amount-desc">Amount ↓</option>
              <option value="amount-asc">Amount ↑</option>
              <option value="category">Category</option>
            </select>
          </div>
        </div>

        <div id="limitWarning" class="limit-warning hidden">
          ⚠️ You've exceeded your spending limit!
        </div>

        <div id="transactionList" class="transaction-list">
          <p class="empty-state">No transactions yet. Add one above! 👆</p>
        </div>
      </section>

      <!-- Pie Chart -->
      <section class="card chart-section">
        <h2 class="section-title">Spending by Category</h2>
        <div class="chart-wrapper">
          <canvas id="spendingChart"></canvas>
          <p class="empty-state chart-empty hidden">Add transactions to see chart 📊</p>
        </div>
      </section>

    </div>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
